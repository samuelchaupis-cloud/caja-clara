version: "3.8"

services:
  # El demonio (worker principal que procesa correos)
  cajaclarad:
    build: .
    container_name: caja_clara_daemon
    restart: unless-stopped
    command: uv run cajaclarad
    volumes:
      - caja_clara_data:/app/data
    env_file:
      - .env
    environment:
      - CAJACLARAD_DB_PATH=/app/data/cajaclarad.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # La API REST (para consumir los datos desde el ERP)
  api:
    build: .
    container_name: caja_clara_api
    restart: unless-stopped
    command: uv run uvicorn caja_clara.api:app --host 0.0.0.0 --port 8000
    # NOTA: Ya no exponemos el puerto 8000 directamente al host por seguridad.
    # El proxy Caddy se encargará de enrutar el tráfico hacia aquí de forma segura.
    expose:
      - "8000"
    volumes:
      - caja_clara_data:/app/data
    env_file:
      - .env
    environment:
      - CAJACLARAD_DB_PATH=/app/data/cajaclarad.db
    depends_on:
      - cajaclarad
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Proxy Inverso Seguro (Auto HTTPS)
  caddy:
    image: caddy:2.8-alpine
    container_name: caja_clara_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  caja_clara_data:
    name: caja_clara_db_volume
  caddy_data:
    name: caja_clara_caddy_data
  caddy_config:
    name: caja_clara_caddy_config
