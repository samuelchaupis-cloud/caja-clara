[project]
name = "caja-clara"
version = "0.1.0"
description = "Daemon de extracción de facturas IMAP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imap-tools>=1.7.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.5.2",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "charset-normalizer>=3.3.2",
    "sdnotify>=0.3.2",
    "rich>=15.0.0",
    "lxml>=6.1.2",
    "pdfplumber>=0.11.10",
    "pypdf>=6.16.2",
    "google-genai>=2.20.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "prometheus-client>=0.20.0",
]

[project.scripts]
cajaclarad = "caja_clara.main:main"
caja-monitor = "caja_clara.cli_monitor:main"
cajaclara-dispatcher = "caja_clara.dispatcher:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "bandit>=1.7.10",
    "mypy>=1.11.0",
    "lxml-stubs>=0.5.1",
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",   # Justificación: Patrón idiomático estándar de FastAPI para inyección de dependencias (Depends).
    "B904",   # Justificación: Excepciones HTTP directas en endpoints de FastAPI (raise HTTPException sin from).
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Justificación: Uso estándar de 'assert' en suites de pruebas unitarias pytest.
    "S105",    # Justificación: Strings dummy de prueba para configuración de variables de entorno IMAP.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "caja_clara.parsers.xml_parser"
disable_error_code = ["union-attr", "index", "arg-type"]


