name: CajaClara CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Lint with Ruff
      run: uv run ruff check src/ tests/

    - name: Security Scan with Bandit
      run: uv run bandit -r src/ -ll -ii
      
    - name: Run Pytest (100% Green Rule)
      run: uv run pytest tests/ -v
      env:
        CAJACLARAD_IMAP_HOST: "test.imap.com"
        CAJACLARAD_IMAP_USER: "test@user.com"
        CAJACLARAD_IMAP_PASSWORD: "dummy"
        CAJACLARAD_DB_PATH: ":memory:"
        CAJACLARAD_API_KEY: "test-secret"
